name: Actualizar Reporte Logística 2ebox

on:
  schedule:
    # 11:00 UTC ~= 08:00 en Chile (verano UTC-3). En invierno (UTC-4) corre una
    # hora antes -- sin impacto, es solo la hora de generación del reporte.
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --- 1. Cumplimiento de Vuelos ---
      - name: Extraer datos — cumplimiento de vuelos
        env:
          NOCO_TOKEN: ${{ secrets.NOCO_TOKEN }}
        run: python extraer_cumplimiento_vuelos.py

      - name: Construir dashboard — cumplimiento de vuelos
        run: python build_dashboard.py

      # --- 2. Rendimiento Logístico (Performance + Análisis de Tiempos) ---
      - name: Extraer datos — rendimiento logístico
        env:
          NOCO_TOKEN: ${{ secrets.NOCO_TOKEN }}
        run: python extraer_rl.py

      - name: Construir dashboard — rendimiento logístico
        run: python build_rl_dashboard.py

      # --- 3. Reporte integrado (las 2 secciones en un solo HTML) ---
      - name: Integrar los 2 reportes
        run: python build_integrado.py

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p public
          cp reporte-integrado-2ebox.html public/index.html
          # también se dejan los 2 reportes sueltos por si se quieren linkear directo
          cp cumplimiento_vuelos.html public/cumplimiento-vuelos.html
          cp reporte-logistica-operaciones.html public/rendimiento-logistico.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
