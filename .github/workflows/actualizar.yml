name: Actualizar dashboard de cumplimiento de vuelos

on:
  schedule:
    # 11:00 UTC ~= 08:00 en Chile (verano: UTC-3, no considera el cambio de
    # horario de invierno UTC-4 -- puede correr una hora antes en esos meses,
    # sin impacto real ya que es solo la hora de generación del reporte).
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extraer datos de NocoDB
        env:
          NOCO_TOKEN: ${{ secrets.NOCO_TOKEN }}
        run: python extraer_cumplimiento_vuelos.py

      - name: Construir el dashboard HTML
        run: python build_dashboard.py

      - name: Preparar carpeta de publicación
        run: |
          mkdir -p public
          cp cumplimiento_vuelos.html public/index.html

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
